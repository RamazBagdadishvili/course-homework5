<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="nav-logo">
        <img src="./logo/viatours-logo.svg" alt="viatours' logo" />
      </div>

      <nav class="nav-menu">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="" class="nav-link">Destinations</a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link">Activities</a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link">USD</a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link">Sign up</a>
          </li>
        </ul>
        <button class="nav-button">Log in</button>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="hero-section">
          <h1>
            Find Your Next <br />
            Destination
          </h1>
          <p class="hero-paragraph">
            From local escapes to far-flung adventures, find what makes you
            happy anytime, anywhere
          </p>
          <button class="hero-button">Start Exploring</button>
        </div>
      </section>

      <section class="destination">
        <div class="destination-wrapper">
          <div class="destination-header">
            <h2>Trending destinations</h2>
            <a href="#" class="see-all">See all</a>
          </div>
          <div class="image-wrapper">
            <img src="./images/paris.png" alt="Paris" />
            <h3 class="city city-top-left">Paris</h3>
          </div>
          <div class="image-wrapper">
            <img src="./images/singapore.png" alt="Singapore" />
            <h3 class="city city-center">Singapore</h3>
          </div>
          <div class="image-wrapper">
            <img src="./images/rome.png" alt="Rome" />
            <h3 class="city city-center">Roma</h3>
          </div>
          <div class="image-wrapper">
            <img src="./images/bangkok.png" alt="Bangkok" />
            <h3 class="city city-top-right">Bangkok</h3>
          </div>
          <div class="image-wrapper">
            <img src="./images/bali.png" alt="Bali" />
            <h3 class="city city-bottom-left">Bali</h3>
          </div>
          <div class="image-wrapper">
            <img src="./images/phuket.png" alt="Phuket" />
            <h3 class="city city-center">Phuket</h3>
          </div>
          <div class="image-wrapper">
            <img src="./images/tokyo.png" alt="Tokyo" />
            <h3 class="city city-center">Tokyo</h3>
          </div>
          <div class="image-wrapper">
            <img src="./images/cappadocia.png" alt="Cappadocia" />
            <h3 class="city city-bottom-right">Cappadocia</h3>
          </div>
        </div>
      </section>
      <img
        src="./images/basic-ui-computer-15-svgrepo-com.svg"
        alt="icon"
        class="fixed-icon"
      />
    </main>
  </body>
</html>
